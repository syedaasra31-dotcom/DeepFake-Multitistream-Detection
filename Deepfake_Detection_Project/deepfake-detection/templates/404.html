<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | DeepGuard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a192f;
            --bg-secondary: #112240;
            --bg-tertiary: #1a3050;
            --accent: #64ffda;
            --accent-hover: #4cd6b4;
            --text-primary: #ccd6f6;
            --text-secondary: #8892b0;
            --text-heading: #e6f1ff;
            --border-color: #233554;
        }

        html { scroll-behavior: smooth; }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background grid */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(100, 255, 218, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(100, 255, 218, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
        }

        /* Floating orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            z-index: 0;
        }
        .orb-1 {
            width: 400px;
            height: 400px;
            background: var(--accent);
            top: -100px;
            right: -100px;
            animation: orbFloat 8s ease-in-out infinite;
        }
        .orb-2 {
            width: 300px;
            height: 300px;
            background: #1a73e8;
            bottom: -80px;
            left: -80px;
            animation: orbFloat 10s ease-in-out infinite reverse;
        }
        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -30px) scale(1.1); }
        }

        .error-container {
            text-align: center;
            z-index: 1;
            padding: 2rem;
            max-width: 600px;
        }

        .error-code-wrapper {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .error-code {
            font-size: 10rem;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, var(--accent) 0%, #4cd6b4 40%, var(--text-heading) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            position: relative;
            animation: glitchShake 4s ease-in-out infinite;
            user-select: none;
        }

        @keyframes glitchShake {
            0%, 92%, 100% { transform: translate(0, 0); }
            93% { transform: translate(-3px, 1px); }
            94% { transform: translate(3px, -1px); }
            95% { transform: translate(-2px, -1px); }
            96% { transform: translate(2px, 1px); }
        }

        .error-icon {
            font-size: 3.5rem;
            color: var(--accent);
            margin-bottom: 1.5rem;
            animation: iconBounce 2s ease-in-out infinite;
            display: block;
        }

        @keyframes iconBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .error-title {
            color: var(--text-heading);
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .error-message {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.8;
            margin-bottom: 2.5rem;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }

        .error-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.85rem 2.2rem;
            background-color: var(--accent);
            color: var(--bg-primary) !important;
            font-weight: 700;
            font-size: 0.95rem;
            border: 2px solid var(--accent);
            border-radius: 10px;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .btn-home:hover {
            background-color: var(--accent-hover);
            border-color: var(--accent-hover);
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(100, 255, 218, 0.3);
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.85rem 2.2rem;
            background-color: transparent;
            color: var(--accent);
            font-weight: 600;
            font-size: 0.95rem;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .btn-back:hover {
            border-color: var(--accent);
            background-color: rgba(100, 255, 218, 0.08);
            transform: translateY(-3px);
        }

        .error-divider {
            width: 60px;
            height: 3px;
            background: var(--accent);
            margin: 0 auto 1.5rem;
            border-radius: 2px;
            opacity: 0.6;
        }

        .error-footer {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            color: var(--text-secondary);
            font-size: 0.8rem;
            z-index: 1;
            opacity: 0.6;
        }
        .error-footer a {
            color: var(--accent);
            text-decoration: none;
        }
        .error-footer a:hover {
            text-decoration: underline;
        }

        /* Scanline overlay */
        .scanlines {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.03) 2px,
                rgba(0, 0, 0, 0.03) 4px
            );
        }

        @media (max-width: 576px) {
            .error-code { font-size: 6rem; }
            .error-title { font-size: 1.4rem; }
            .error-message { font-size: 0.95rem; }
            .error-actions { flex-direction: column; align-items: center; }
            .btn-home, .btn-back { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="scanlines"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="error-container">
        <div class="error-code-wrapper">
            <i class="fas fa-ghost error-icon"></i>
            <div class="error-code">404</div>
        </div>
        <div class="error-divider"></div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-message">
            Oops! The page you're looking for seems to have vanished into the digital void.
            It might have been moved, deleted, or never existed in the first place.
        </p>
        <div class="error-actions">
            <a href="/" class="btn-home">
                <i class="fas fa-home"></i> Back to Home
            </a>
            <a href="javascript:history.back()" class="btn-back">
                <i class="fas fa-arrow-left"></i> Go Back
            </a>
        </div>
    </div>

    <div class="error-footer">
        <a href="/">DeepGuard</a> &mdash; AI Deepfake Detection System
    </div>
</body>
</html>
